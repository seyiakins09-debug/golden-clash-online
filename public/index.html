<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Golden Clash Online</title><style>
body{background:#090a0d;color:#eee;font:15px Arial;margin:0}header{padding:20px;color:#e8bd58;font-size:28px;font-weight:bold}main{display:grid;grid-template-columns:300px 1fr;gap:16px;padding:16px;max-width:1200px;margin:auto}.box{background:#171a20;border:1px solid #444;border-radius:12px;padding:16px}h3{color:#e8bd58}input,select{box-sizing:border-box;width:100%;padding:10px;margin:5px 0;background:#090b0f;color:white;border:1px solid #444;border-radius:7px}button{padding:10px;margin:4px;background:#e8bd58;border:0;border-radius:7px;font-weight:bold;cursor:pointer}.secondary{background:#303641;color:white}.danger{background:#8b3038;color:white}.muted{color:#aaa;font-size:12px}.rounds{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.round{padding:10px;background:#111;border:1px solid #444;border-radius:8px;font-size:12px}.round.active{border-color:#e8bd58}.challenge{text-align:center;padding:35px 15px;background:#292216;border-radius:10px;margin:15px 0}.prompt{font-size:24px;margin:15px}.gold{color:#e8bd58}.hide{display:none}table{width:100%;text-align:left}td,th{padding:8px;border-bottom:1px solid #444}#err{color:#ff8989}@media(max-width:750px){main{grid-template-columns:1fr}.rounds{grid-template-columns:repeat(2,1fr)}}</style></head><body><header>GOLDEN CLASH <small style="display:block;font-size:11px;color:#aaa">LIVE MULTIPLAYER • HOST CONTROLLED</small></header><main>
<section class="box"><h3>ROOM ACCESS</h3><input id="name" placeholder="Your name"><input id="code" placeholder="Room code (players)"><input id="pin" type="password" placeholder="Host PIN (4+ chars)"><button id="create">Create room</button><button class="secondary" id="join">Join room</button><div id="room" class="hide"><p>Room code: <b id="roomcode" class="gold"></b></p><button class="secondary" id="copy">Copy code</button></div><div id="host" class="hide"><h3>Host controls</h3><select id="set"></select><button id="start">Start set</button><select id="round"></select><button id="open">Open selected round</button><button class="secondary" id="close">Close round</button><button class="secondary" id="reveal">Reveal answer</button><select id="player"></select><input id="xp" type="number" value="500"><button id="award">Award XP</button><button class="secondary" id="clear">Clear player XP</button><button class="secondary" id="finish">Finish set</button><button class="danger" id="reset">Log out & reset room</button></div><p class="muted">Host controls only. XP clears when the host resets the room.</p><div id="err"></div></section>
<section class="box"><h3>SHARED GAME BOARD</h3><div id="label" class="muted">Waiting for room</div><div class="rounds" id="rounds"></div><div class="challenge"><div class="gold" id="title">GOLDEN CLASH</div><div class="prompt" id="prompt">Host will start the set.</div><div id="answer" class="hide"></div></div><h3>Live leaderboard</h3><table><thead><tr><th>Player</th><th>XP</th><th>Awards</th></tr></thead><tbody id="scores"></tbody></table></section></main>
<script src="/socket.io/socket.io.js"></script><script>
const ioClient=io();let role='',roomCode='',st=null;const $=x=>document.getElementById(x);
const rounds=['Coding Intelligence','Coding Puzzle','Coding Memory','Golden Strategy','Golden Jackpot'],xp=[500,1000,1500,2000,3000];
const qs=[
[['Sequence 2, 6, 12, 20, 30, __?','42'],['Logic: all labels on APPLES, ORANGES, MIXED boxes are wrong. Pick from which box first?','MIXED'],['Memorize GOLD, 7, RIVER, 2. What was third?','RIVER'],['Three tasks; one unlocks the others. What first?','Complete prerequisite'],['Double a number then add 12 = 50. Number?','19']],
[['A=1..Z=26. What is GAME?','26'],['Keys but no locks, space but no room?','Keyboard'],['Memorize 4,9,1,6,3. Second number?','9'],['Choose a risky shortcut or safe route. What weigh?','Risk and consequences'],['Next: 1,4,9,16,25,__?','36']],
[['Binary 5?','101'],['Animal hidden in CATch?','CAT'],['Memorize LION, STAR, KEY, MOON. First?','LION'],['Assign puzzle expert and memory expert to?','Their strongest rounds'],['13 hearts but no organs?','Deck of cards']]
];for(let i=1;i<=30;i++)$('set').add(new Option('Set '+i,i));rounds.forEach((n,i)=>$('round').add(new Option('Round '+(i+1)+' — '+n,i)));
ioClient.on('connect',()=>{$('label').textContent='Connected to server'});ioClient.on('err',m=>$('err').textContent=m);ioClient.on('created',c=>{roomCode=c;role='host';setup()});ioClient.on('joined',c=>{roomCode=c;role='player';setup()});function setup(){$('room').classList.remove('hide');$('roomcode').textContent=roomCode;if(role==='host')$('host').classList.remove('hide')}
$('create').onclick=()=>ioClient.emit('create',{name:$('name').value,pin:$('pin').value});$('join').onclick=()=>ioClient.emit('join',{name:$('name').value,code:$('code').value});$('copy').onclick=()=>navigator.clipboard.writeText(roomCode);
function host(a,o={}){ioClient.emit('host',{a,...o})}
$('start').onclick=()=>host('start',{set:$('set').value});$('open').onclick=()=>{let s=+$('set').value, r=+$('round').value;host('open',{q:qs[(s-1)%qs.length][r]})};$('close').onclick=()=>host('close');$('reveal').onclick=()=>host('reveal');$('award').onclick=()=>host('award',{id:$('player').value,xp:$('xp').value});$('clear').onclick=()=>host('clear',{id:$('player').value});$('finish').onclick=()=>host('finish');$('reset').onclick=()=>confirm('Delete room and clear session XP?')&&host('reset');
ioClient.on('ended',()=>{alert('Host ended session. XP cleared.');location.reload()});
ioClient.on('state',s=>{st=s;$('label').textContent=s.active?'SET '+s.setNo+' • '+s.players.length+' players':'Room waiting for host';$('rounds').innerHTML=rounds.map((n,i)=>'<div class="round '+(s.open&&s.round===i?'active':'')+'">Round '+(i+1)+'<br><b>'+n+'</b><br><span class="gold">'+xp[i]+' XP</span></div>').join('');if(s.open&&s.challenge){$('title').textContent='ROUND '+(s.round+1)+' • '+rounds[s.round];$('prompt').textContent=s.challenge[0];$('answer').textContent=s.reveal?'Answer: '+s.challenge[1]:'';$('answer').classList.toggle('hide',!s.reveal)}else{$('prompt').textContent='Host will open the next round.';$('answer').classList.add('hide')}$('scores').innerHTML=s.players.sort((a,b)=>b.xp-a.xp).map(p=>'<tr><td>'+p.name+'</td><td>'+p.xp+'</td><td>'+p.awards+'</td></tr>').join('');$('player').innerHTML=s.players.map(p=>'<option value="'+p.id+'">'+p.name+'</option>').join('')});
</script></body></html>
